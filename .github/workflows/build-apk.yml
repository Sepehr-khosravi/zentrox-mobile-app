name: Build Zentrox APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Upgrade Expo and Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      npm_config_legacy_peer_deps: true
      npm_config_fetch_retries: 5
      npm_config_fetch_timeout: 120000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Upgrade Expo to SDK 53
        run: |
          npm install 'expo@~53.0.0' --save --no-audit --no-fund

      - name: Align dependencies with Expo SDK 53
        run: |
          npx expo install --fix
          npx expo install expo-linear-gradient

      - name: Apply compatible dependency overrides
        run: |
          npm pkg set 'overrides.expo-linear-gradient=$expo-linear-gradient'
          npm pkg set 'overrides.react-native-reanimated=$react-native-reanimated'
          npm install --no-audit --no-fund

      - name: Verify installed dependencies
        run: |
          npm ls expo expo-linear-gradient expo-modules-core react react-native react-native-reanimated

      - name: Check Expo configuration
        run: npx expo config --type public

      - name: Run Expo Doctor
        run: npx expo-doctor || true

      - name: Test Android JavaScript bundle
        run: npx expo export --platform android

      - name: Generate clean Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Zentrox-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14