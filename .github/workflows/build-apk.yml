name: Build Zentrox APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Expo Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --registry=https://registry.npmjs.org/ --replace-registry-host=always

      - name: Align Expo dependencies
        run: npx expo install --fix

      - name: Print installed package versions
        run: |
          npm ls expo expo-modules-core expo-linear-gradient react-native --depth=2 || true
          node -e "for (const p of ['expo','expo-modules-core','expo-linear-gradient','react-native']) { try { const j=require(p+'/package.json'); console.log(p+': '+j.version); } catch(e) { console.log(p+': NOT FOUND'); } }"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Print Gradle version
        working-directory: android
        run: cat gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zentrox-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
